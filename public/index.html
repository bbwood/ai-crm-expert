<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI CRM Expert - PDF Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1000px;
            width: 100%;
            height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .upload-section {
            padding: 30px;
            border-bottom: 2px solid #f0f0f0;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9ff;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f3ff;
        }

        .upload-area.dragging {
            border-color: #764ba2;
            background: #e8ebff;
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .upload-text {
            font-size: 16px;
            color: #667eea;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .upload-hint {
            font-size: 14px;
            color: #666;
        }

        .file-input {
            display: none;
        }

        .uploaded-file {
            margin-top: 20px;
            padding: 16px;
            background: #e8f5e9;
            border-radius: 8px;
            display: none;
            align-items: center;
            justify-content: space-between;
        }

        .uploaded-file.show {
            display: flex;
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .file-icon {
            font-size: 24px;
        }

        .file-name {
            font-weight: 600;
            color: #2e7d32;
        }

        .remove-btn {
            background: #c62828;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .remove-btn:hover {
            background: #b71c1c;
        }

        .chat-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            background: #fafafa;
        }

        .message {
            margin-bottom: 20px;
            display: flex;
            gap: 12px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 70%;
            padding: 16px 20px;
            border-radius: 18px;
            line-height: 1.5;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.ai .message-content {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 4px;
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background: #667eea;
            order: 2;
        }

        .message.ai .message-avatar {
            background: #f0f0f0;
        }

        .input-section {
            padding: 20px 30px;
            background: white;
            border-top: 2px solid #f0f0f0;
        }

        .input-container {
            display: flex;
            gap: 12px;
        }

        .message-input {
            flex: 1;
            padding: 14px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        .message-input:focus {
            border-color: #667eea;
        }

        .generate-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .generate-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .generate-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: scale(1);
            box-shadow: none;
        }

        .send-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: transform 0.2s;
        }

        .send-btn:hover {
            transform: scale(1.05);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: scale(1);
        }

        .loading {
            display: flex;
            gap: 6px;
            padding: 16px 20px;
        }

        .loading-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #667eea;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .loading-dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .loading-dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0);
            }
            40% {
                transform: scale(1);
            }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state-text {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .empty-state-hint {
            font-size: 14px;
            color: #bbb;
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 16px;
            border-left: 4px solid #c62828;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>AI CRM Expert</h1>
            <p>Upload a PDF invoice and chat with AI about customer retention</p>
        </div>

        <div class="upload-section">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📄</div>
                <div class="upload-text">Click to upload or drag and drop</div>
                <div class="upload-hint">PDF files only (max 10MB each, multiple files supported)</div>
            </div>
            <input type="file" id="fileInput" class="file-input" accept=".pdf" multiple>
            <div class="uploaded-file" id="uploadedFile">
                <div class="file-info">
                    <span class="file-icon">📎</span>
                    <span class="file-name" id="fileName"></span>
                </div>
                <button class="remove-btn" id="removeBtn">Remove</button>
            </div>
        </div>

        <div class="chat-section">
            <div class="messages" id="messages">
                <div class="empty-state">
                    <div class="empty-state-icon">💬</div>
                    <div class="empty-state-text">No messages yet</div>
                    <div class="empty-state-hint">Upload a PDF to get started</div>
                </div>
            </div>

            <div class="input-section">
                <div class="input-container">
                    <button id="generateBtn" class="generate-btn" disabled>✨ Generate Message</button>
                    <input
                        type="text"
                        id="messageInput"
                        class="message-input"
                        placeholder="Ask about the invoice..."
                        disabled
                    >
                    <button id="sendBtn" class="send-btn" disabled>Send</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let uploadedFiles = [];
        let parsedInvoices = [];
        let contexts = [];

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const uploadedFileDiv = document.getElementById('uploadedFile');
        const fileName = document.getElementById('fileName');
        const removeBtn = document.getElementById('removeBtn');
        const messages = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const generateBtn = document.getElementById('generateBtn');

        // Upload area click
        uploadArea.addEventListener('click', () => fileInput.click());

        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragging');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragging');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragging');

            const files = Array.from(e.dataTransfer.files).filter(f => f.type === 'application/pdf');
            if (files.length > 0) {
                handleMultipleFileUploads(files);
            }
        });

        // File input change
        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            if (files.length > 0) {
                handleMultipleFileUploads(files);
            }
        });

        // Remove file
        removeBtn.addEventListener('click', () => {
            uploadedFiles = [];
            parsedInvoices = [];
            contexts = [];
            uploadedFileDiv.classList.remove('show');
            fileInput.value = '';
            messageInput.disabled = true;
            sendBtn.disabled = true;
            generateBtn.disabled = true;
            clearMessages();
        });

        // Generate message button
        generateBtn.addEventListener('click', generateRetentionMessage);

        // Send message
        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !sendBtn.disabled) {
                sendMessage();
            }
        });

        async function handleMultipleFileUploads(files) {
            clearMessages();

            // Clear old data when uploading new files
            uploadedFiles = [];
            parsedInvoices = [];
            contexts = [];

            uploadedFiles = files;

            fileName.textContent = files.length === 1 ? files[0].name : `${files.length} files selected`;
            uploadedFileDiv.classList.add('show');

            addMessage('ai', `Processing ${files.length} PDF file(s)...`);

            for (const file of files) {
                await handleSingleFileUpload(file);
            }

            addMessage('ai', `All files processed! You now have ${uploadedFiles.length} invoice(s) loaded. What would you like to know or do?`);
            messageInput.disabled = false;
            sendBtn.disabled = false;
            generateBtn.disabled = false;
            messageInput.focus();
        }

        async function handleSingleFileUpload(file) {
            const formData = new FormData();
            formData.append('invoice', file);

            try {
                const response = await fetch('/api/upload-invoice', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    parsedInvoices.push(data.parsed_invoice);
                    contexts.push(data.context);

                    // Show summary
                    let summary = `✓ ${file.name}\n`;
                    summary += `Customer: ${data.context.customer.name}\n`;
                    summary += `Vehicle: ${data.context.vehicle.year} ${data.context.vehicle.make} ${data.context.vehicle.model}\n`;
                    summary += `Total: $${data.parsed_invoice.total_amount || data.parsed_invoice.total || 'N/A'}`;

                    addMessage('ai', summary);

                    // Add the full context JSON as a collapsible message
                    addJsonMessage(`Context for ${file.name} (Click to expand)`, {
                        parsed_invoice: data.parsed_invoice,
                        context: data.context
                    });
                } else {
                    addMessage('ai', `✗ Error processing ${file.name}: ${data.message || 'Failed to process PDF'}`);
                }
            } catch (error) {
                addMessage('ai', `✗ Error processing ${file.name}: ${error.message}`);
            }
        }

        async function handleFileUpload(file) {
            uploadedFiles = [file];
            fileName.textContent = file.name;
            uploadedFileDiv.classList.add('show');

            clearMessages();
            addMessage('ai', `Processing ${file.name}...`);

            const formData = new FormData();
            formData.append('invoice', file);

            try {
                const response = await fetch('/api/upload-invoice', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    parsedInvoices = [data.parsed_invoice];
                    contexts = [data.context];

                    clearMessages();

                    // Show summary
                    let summary = `Great! I've analyzed ${file.name}. Here's what I found:\n\n`;
                    summary += `Customer: ${data.context.customer.name}\n`;
                    summary += `Vehicle: ${data.context.vehicle.year} ${data.context.vehicle.make} ${data.context.vehicle.model}\n`;
                    summary += `Total: $${data.parsed_invoice.total_amount || data.parsed_invoice.total || 'N/A'}\n\n`;
                    summary += `What would you like to know or do?`;

                    addMessage('ai', summary);

                    // Add the full context JSON as a collapsible message
                    addJsonMessage('Extracted Context (Click to expand)', {
                        parsed_invoice: data.parsed_invoice,
                        context: data.context
                    });

                    messageInput.disabled = false;
                    sendBtn.disabled = false;
                    generateBtn.disabled = false;
                    messageInput.focus();
                } else {
                    addMessage('ai', `Error: ${data.message || 'Failed to process PDF'}`);
                }
            } catch (error) {
                addMessage('ai', `Error: ${error.message}`);
            }
        }

        async function generateRetentionMessage() {
            if (contexts.length === 0) return;

            let context;

            // If multiple vehicles, let user choose
            if (contexts.length > 1) {
                context = await promptVehicleSelection();
                if (!context) return; // User cancelled
            } else {
                context = contexts[0];
            }

            generateBtn.disabled = true;
            messageInput.disabled = true;
            sendBtn.disabled = true;

            const loadingId = addLoadingMessage();

            try {
                const response = await fetch('/api/generate-message', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ context })
                });

                const data = await response.json();
                removeLoadingMessage(loadingId);

                if (data.success) {
                    let responseText = `Here's a ${data.task_type} message for the customer:\n\n"${data.message}"\n\n`;
                    responseText += `Task Selection: ${data.task_selection_reason}\n`;
                    if (data.scores) {
                        responseText += `\nScores:\n`;
                        responseText += `- Trust & Tone: ${data.scores.trust_tone}/10\n`;
                        responseText += `- Clarity: ${data.scores.clarity}/10\n`;
                        responseText += `- Retention Impact: ${data.scores.retention_impact}/10`;
                    }
                    addMessage('ai', responseText);
                } else {
                    addMessage('ai', `Error: ${data.message || 'Failed to generate message'}`);
                }
            } catch (error) {
                removeLoadingMessage(loadingId);
                addMessage('ai', `Error: ${error.message}`);
            }

            generateBtn.disabled = false;
            messageInput.disabled = false;
            sendBtn.disabled = false;
        }

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;

            addMessage('user', message);
            messageInput.value = '';
            messageInput.disabled = true;
            sendBtn.disabled = true;

            // Show loading indicator
            const loadingId = addLoadingMessage();

            try {
                // Send message to chat endpoint to get AI response
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: message,
                        contexts: contexts,
                        parsedInvoices: parsedInvoices
                    })
                });

                const data = await response.json();
                removeLoadingMessage(loadingId);

                if (data.success) {
                    addMessage('ai', data.response);
                } else {
                    addMessage('ai', `Error: ${data.message || 'Failed to get response'}`);
                }
            } catch (error) {
                removeLoadingMessage(loadingId);
                addMessage('ai', `Error: ${error.message}`);
            }

            messageInput.disabled = false;
            sendBtn.disabled = false;
            messageInput.focus();
        }

        function addMessage(type, content) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;

            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = type === 'user' ? '👤' : '🤖';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';

            // Preserve line breaks and formatting
            if (type === 'ai') {
                // Convert markdown-style bold (**text**) to HTML
                content = content.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                // Convert line breaks to <br> tags
                content = content.replace(/\n/g, '<br>');
                contentDiv.innerHTML = content;
            } else {
                contentDiv.textContent = content;
            }

            messageDiv.appendChild(avatar);
            messageDiv.appendChild(contentDiv);

            // Remove empty state if exists
            const emptyState = messages.querySelector('.empty-state');
            if (emptyState) {
                emptyState.remove();
            }

            messages.appendChild(messageDiv);
            messages.scrollTop = messages.scrollHeight;
        }

        function addJsonMessage(title, jsonData) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ai';

            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = '📋';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content json-message';
            contentDiv.style.cursor = 'pointer';
            contentDiv.style.userSelect = 'none';

            const titleDiv = document.createElement('div');
            titleDiv.style.fontWeight = '600';
            titleDiv.style.marginBottom = '8px';
            titleDiv.textContent = title;

            const jsonDiv = document.createElement('pre');
            jsonDiv.style.display = 'none';
            jsonDiv.style.background = '#f5f5f5';
            jsonDiv.style.padding = '12px';
            jsonDiv.style.borderRadius = '6px';
            jsonDiv.style.overflow = 'auto';
            jsonDiv.style.maxHeight = '400px';
            jsonDiv.style.fontSize = '12px';
            jsonDiv.style.marginTop = '8px';
            jsonDiv.textContent = JSON.stringify(jsonData, null, 2);

            contentDiv.appendChild(titleDiv);
            contentDiv.appendChild(jsonDiv);

            contentDiv.addEventListener('click', () => {
                if (jsonDiv.style.display === 'none') {
                    jsonDiv.style.display = 'block';
                    titleDiv.textContent = title.replace('Click to expand', 'Click to collapse');
                } else {
                    jsonDiv.style.display = 'none';
                    titleDiv.textContent = title.replace('Click to collapse', 'Click to expand');
                }
            });

            messageDiv.appendChild(avatar);
            messageDiv.appendChild(contentDiv);

            messages.appendChild(messageDiv);
            messages.scrollTop = messages.scrollHeight;
        }

        function addLoadingMessage() {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ai';
            const id = 'loading-' + Date.now();
            messageDiv.id = id;

            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = '🤖';

            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'loading';
            loadingDiv.innerHTML = '<div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div>';

            messageDiv.appendChild(avatar);
            messageDiv.appendChild(loadingDiv);
            messages.appendChild(messageDiv);
            messages.scrollTop = messages.scrollHeight;

            return id;
        }

        function removeLoadingMessage(id) {
            const loadingMsg = document.getElementById(id);
            if (loadingMsg) {
                loadingMsg.remove();
            }
        }

        function promptVehicleSelection() {
            return new Promise((resolve) => {
                // Group contexts by unique vehicle (using VIN or make/model/year)
                const uniqueVehicles = new Map();

                contexts.forEach((ctx) => {
                    const vehicle = ctx.vehicle;
                    const key = vehicle.vin || `${vehicle.year}-${vehicle.make}-${vehicle.model}`;

                    if (!uniqueVehicles.has(key)) {
                        uniqueVehicles.set(key, {
                            context: ctx,
                            invoiceCount: 1
                        });
                    } else {
                        // Use the most recent visit
                        const existing = uniqueVehicles.get(key);
                        const existingDate = new Date(existing.context.service_history.recent_visit.date);
                        const currentDate = new Date(ctx.service_history.recent_visit.date);

                        if (currentDate > existingDate) {
                            existing.context = ctx;
                        }
                        existing.invoiceCount++;
                    }
                });

                const vehicleArray = Array.from(uniqueVehicles.values());

                // Create a nice selection message
                let selectionText = `🚗 You have ${vehicleArray.length} vehicle(s). Which one would you like to generate a message for?\n\n`;

                vehicleArray.forEach((veh, index) => {
                    const vehicle = veh.context.vehicle;
                    const customer = veh.context.customer;
                    const invoiceText = veh.invoiceCount > 1 ? ` (${veh.invoiceCount} invoices)` : '';

                    selectionText += `${index + 1}. ${vehicle.year} ${vehicle.make} ${vehicle.model}${invoiceText}\n`;
                    selectionText += `   Customer: ${customer.name}\n`;
                    selectionText += `   Last visit: ${veh.context.service_history.recent_visit.date}\n\n`;
                });

                selectionText += 'Type the number (1, 2, 3, etc.) to select a vehicle:';

                addMessage('ai', selectionText);

                // Temporarily override the send message handler
                const originalHandler = sendBtn.onclick;
                messageInput.disabled = false;
                sendBtn.disabled = false;
                messageInput.focus();

                const handleSelection = () => {
                    const input = messageInput.value.trim();
                    const selection = parseInt(input);

                    if (selection >= 1 && selection <= vehicleArray.length) {
                        addMessage('user', input);
                        const selectedVehicle = vehicleArray[selection - 1];
                        const selectedContext = selectedVehicle.context;
                        const vehicle = selectedContext.vehicle;
                        addMessage('ai', `Great! Generating message for the ${vehicle.year} ${vehicle.make} ${vehicle.model}...`);

                        // Restore original handler
                        sendBtn.removeEventListener('click', handleSelection);
                        messageInput.removeEventListener('keypress', handleSelectionKey);
                        sendBtn.onclick = originalHandler;

                        messageInput.value = '';
                        resolve(selectedContext);
                    } else {
                        addMessage('ai', `Please enter a valid number between 1 and ${vehicleArray.length}`);
                        messageInput.value = '';
                        messageInput.focus();
                    }
                };

                const handleSelectionKey = (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        handleSelection();
                    }
                };

                sendBtn.addEventListener('click', handleSelection);
                messageInput.addEventListener('keypress', handleSelectionKey);
            });
        }

        function clearMessages() {
            messages.innerHTML = '';
        }
    </script>
</body>
</html>
